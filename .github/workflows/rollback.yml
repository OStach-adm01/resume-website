name: Rollback
on:
  workflow_dispatch:
    inputs:
      release:
        description: Previously published 40-character Git SHA
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-mutations
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Resolve current infrastructure and redeploy a release
        env:
          RELEASE_SHA: ${{ inputs.release }}
          SITE_URL: https://${{ vars.DOMAIN_NAME }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters Name=tag:Project,Values=resume-website Name=instance-state-name,Values=running --query 'Reservations[].Instances[].InstanceId | [0]' --output text)
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '$DOMAIN_NAME')].Id | [0]" --output text)
          export INSTANCE_ID DISTRIBUTION_ID
          bash scripts/deploy-release.sh
